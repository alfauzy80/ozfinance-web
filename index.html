<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZfinance Super Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(-45deg, #000000, #111827, #1f2937, #000000); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: #f8fafc; min-height: 100vh; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 204, 0, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); }
        .glass-card { background: rgba(31, 41, 55, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
        .glass-card:hover { transform: translateY(-5px); border-color: rgba(255, 204, 0, 0.3); background: rgba(31, 41, 55, 0.8); box-shadow: 0 10px 25px rgba(255, 204, 0, 0.05); }
        .progress-fill { transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .shimmer { position: relative; overflow: hidden; }
        .shimmer::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%); transform: translateX(-100%); animation: shimmer 2.5s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 204, 0, 0.2); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 204, 0, 0.4); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans antialiased relative">

    <div id="loading-overlay" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[200] hidden flex-col items-center justify-center transition-opacity duration-300">

            <img src="https://dl.dropboxusercontent.com/scl/fi/b3vvowv2tpjz7x4tl5kq0/OZ.png?rlkey=e2oamdv1tprgrdf5j2kjpgu46&st=368naga4&dl=0" alt="OZ Logo" class="w-20 h-20 mx-auto mb-4 object-contain drop-shadow-[0_0_15px_rgba(253,224,38,0.6)]">
            
            <h2 id="auth-title" class="text-2xl font-bold text-white mb-2">Login Nasabah</h2>

    <!-- Main Container -->

            <div class="flex justify-between items-center mb-5 border-b border-white/10 pb-3 sticky top-0 bg-gray-900 z-10">
                <h3 id="modal-title" class="text-lg font-bold text-white"><i class="fa-solid fa-pen-to-square text-yellow-400 mr-2"></i> Edit Data</h3>

    <!-- Modal Share Link Baru -->
    <div id="share-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 p-4"><div class="glass-panel w-full max-w-md rounded-2xl p-6 transform scale-95 transition-transform duration-300 bg-gray-900" id="share-modal-content"><div class="flex justify-between items-center mb-4 border-b border-white/10 pb-3"><h3 class="text-lg font-bold text-white"><i class="fa-solid fa-share-nodes text-yellow-400 mr-2"></i> Tautan Nasabah</h3><button type="button" onclick="window.closeShareModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button></div><div class="flex items-center gap-2 mb-4"><input type="text" id="share-link-input" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-3 py-2.5 text-gray-300 text-xs focus:outline-none" readonly><button type="button" id="copy-btn" onclick="window.copyShareLink()" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 px-4 py-2.5 rounded-lg text-sm font-bold flex items-center gap-2"><i class="fa-solid fa-copy"></i> Salin</button></div></div></div>
    
    <div id="pwd-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 p-4"><div class="glass-panel w-full max-w-sm rounded-2xl p-6 transform scale-95 transition-transform duration-300 bg-gray-900 border border-yellow-500/20" id="pwd-modal-content"><div class="flex justify-between items-center mb-5 border-b border-white/10 pb-3"><h3 class="text-lg font-bold text-white"><i class="fa-solid fa-key text-yellow-400 mr-2"></i> Ganti Password</h3><button type="button" onclick="window.closePwdModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button></div><form onsubmit="window.submitPwdAction(); return false;" class="space-y-4"><div><label class="block text-xs text-gray-400 mb-1">Password Lama</label><input type="password" id="pwd-old" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm" required></div><div><label class="block text-xs text-gray-400 mb-1">Password Baru</label><input type="password" id="pwd-new" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm" required></div><div id="pwd-error" class="hidden text-red-400 text-xs font-medium bg-red-500/10 py-2 rounded-lg text-center"></div><div id="pwd-success" class="hidden text-green-400 text-xs font-bold bg-green-500/10 py-2 rounded-lg text-center">Tersimpan!</div><div class="pt-4 flex gap-3"><button type="button" onclick="window.closePwdModal()" class="flex-1 px-4 py-2 bg-gray-700 text-white rounded-xl text-sm font-medium">Batal</button><button type="submit" class="flex-1 px-4 py-2 bg-gradient-to-r from-yellow-500 to-yellow-400 text-gray-900 rounded-xl text-sm font-bold">Simpan</button></div></form></div></div>

    <!-- ============================================== -->
    <!-- SISTEM FIREBASE MODERN (MENGGANTIKAN CODE.GS)  -->
    <!-- ============================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Konfigurasi Database Firebase Anda
        const firebaseConfig = {
            const firebaseConfig = {
    apiKey: "AIzaSyBkHkY6dAYWppYWRFPRum2bwx2Dgnk8pV4",
    authDomain: "ozfinance-5fb9c.firebaseapp.com",
    databaseURL: "https://ozfinance-5fb9c-default-rtdb.firebaseio.com", // PASTIKAN URL INI BENAR
    projectId: "ozfinance-5fb9c",
    // ... (biarkan baris lain di bawahnya tetap sama)
};
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const dbRef = ref(db, 'ozfinance_data');

        // State Global Aplikasi
        const PWD_STORAGE_KEY = 'ozfinance_admin_pwd';
        const BIO_CRED_KEY = 'oz_biometric_id';
        const BIO_WA_KEY = 'oz_biometric_wa';

        window.allServerData = []; 
        window.appData = []; 
        window.isReadOnly = false;
        window.adminPassword = localStorage.getItem(PWD_STORAGE_KEY) || "0000";
        window.loginMode = 'nasabah';
        window.currentLoggedWA = null; 
        window.temporaryBase64Photo = null; 
        let deleteConfirmTimeout;

        window.normalizeWA = function(num) {
            if (!num) return "";
            let str = String(num).replace(/\D/g, ''); 
            if (str.startsWith('08')) str = '62' + str.substring(1); 
            return str;
        };

        window.showLoading = function(text) { document.getElementById('loading-text').innerText = text || "Memproses..."; document.getElementById('loading-overlay').classList.remove('hidden'); document.getElementById('loading-overlay').classList.add('flex'); };
        window.hideLoading = function() { document.getElementById('loading-overlay').classList.add('hidden'); document.getElementById('loading-overlay').classList.remove('flex'); };

        // FIREBASE: MENYIMPAN DATA REALTIME
        window.saveAppDataFirebase = async function() {
            window.showLoading("Menyimpan ke Cloud...");
            const dataObj = {};
            window.allServerData.forEach(d => { dataObj[d.id] = d; });
            try {
                await set(dbRef, dataObj);
            } catch(e) {
                alert("Error koneksi Firebase: Cek pengaturan Database URL atau Aturan Keamanan (Rules) di Firebase Console.");
            }
            window.hideLoading();
        };

        // FIREBASE: MENDENGARKAN DATA REALTIME OTOMATIS
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            let parsedData = [];
            if (data) {
                Object.keys(data).forEach(key => { parsedData.push(data[key]); });
            }
            window.allServerData = parsedData;
            
            // Auto Update UI jika user sedang login
            if(window.isReadOnly && window.currentLoggedWA) {
                window.appData = window.allServerData.filter(d => d.wa && window.normalizeWA(d.wa) === window.currentLoggedWA);
                window.renderDashboard();
            } else if (!window.isReadOnly && window.currentLoggedWA === null && document.getElementById('auth-screen').classList.contains('hidden')) {
                window.appData = window.allServerData;
                window.renderDashboard();
            }
            
            window.hideLoading();
        });

        // Deteksi Tautan Vercel Canggih (Bypass Login jika URL membawa nomor WA)
        window.onload = function() {
            window.showLoading("Menghubungkan ke Server...");
            const urlParams = new URLSearchParams(window.location.search);
            const passedWA = urlParams.get('wa');
            
            // Tunggu data firebase turun pertama kali, baru proses login
            setTimeout(() => {
                if (passedWA) {
                    const normalizedPassed = window.normalizeWA(passedWA);
                    const customerData = window.allServerData.filter(d => d.wa && window.normalizeWA(d.wa) === normalizedPassed);
                    if (customerData.length > 0) {
                        window.handleLoginSuccess(customerData, normalizedPassed);
                    }
                }
            }, 1500); // Beri waktu 1.5 detik untuk Firebase mendownload data
        };

        // --- SISTEM TAB LOGIN ---
        window.switchTab = function(mode) {
            window.loginMode = mode;
            if (mode === 'nasabah') {
                document.getElementById('tab-nasabah').className = 'flex-1 py-2 text-sm font-bold rounded-md bg-yellow-500 text-black shadow transition-all';
                document.getElementById('tab-admin').className = 'flex-1 py-2 text-sm font-bold rounded-md text-gray-400 hover:text-white transition-all';
                document.getElementById('auth-title').textContent = 'Login Nasabah';
                document.getElementById('auth-subtitle').textContent = 'Masukkan Nomor WhatsApp Anda.';
                document.getElementById('auth-input').type = 'number';
                document.getElementById('auth-input').placeholder = 'Contoh: 0812... atau 628...';
                document.getElementById('auth-input').value = '';
                document.getElementById('btn-biometric-login').classList.remove('hidden');
            } else {
                document.getElementById('tab-admin').className = 'flex-1 py-2 text-sm font-bold rounded-md bg-yellow-500 text-black shadow transition-all';
                document.getElementById('tab-nasabah').className = 'flex-1 py-2 text-sm font-bold rounded-md text-gray-400 hover:text-white transition-all';
                document.getElementById('auth-title').textContent = 'Login Admin';
                document.getElementById('auth-subtitle').textContent = 'Masukkan password untuk mengakses data.';
                document.getElementById('auth-input').type = 'password';
                document.getElementById('auth-input').placeholder = '••••';
                document.getElementById('auth-input').value = '';
                document.getElementById('btn-biometric-login').classList.add('hidden'); 
            }
        };

        window.handleLoginSuccess = function(customerData, wa) {
            window.isReadOnly = true;
            window.appData = customerData;
            window.currentLoggedWA = window.normalizeWA(wa);
            
            document.getElementById('admin-actions').style.display = 'none'; 
            document.getElementById('btn-profile').classList.remove('hidden'); document.getElementById('btn-profile').classList.add('flex');
            document.getElementById('nav-left').style.display = 'none'; document.getElementById('nav-right').style.display = 'none';
            
            document.getElementById('auth-screen').classList.add('opacity-0');
            setTimeout(() => { document.getElementById('auth-screen').classList.add('hidden'); }, 500);
            window.renderDashboard();
        };

        window.processLoginAction = function() {
            const input = document.getElementById('auth-input').value.trim();
            const errorDiv = document.getElementById('auth-error');
            
            if (window.loginMode === 'admin') {
                if (input === window.adminPassword) {
                    window.isReadOnly = false;
                    window.currentLoggedWA = null;
                    window.appData = window.allServerData;
                    
                    document.getElementById('admin-actions').style.display = 'flex';
                    document.getElementById('btn-profile').classList.add('hidden'); document.getElementById('btn-profile').classList.remove('flex');
                    document.getElementById('nav-left').style.display = 'flex'; document.getElementById('nav-right').style.display = 'flex';
                    
                    document.getElementById('auth-screen').classList.add('opacity-0');
                    setTimeout(() => { document.getElementById('auth-screen').classList.add('hidden'); }, 500);
                    window.renderDashboard();
                } else {
                    errorDiv.textContent = 'Password admin salah!'; errorDiv.classList.remove('hidden');
                    setTimeout(() => { errorDiv.classList.add('hidden'); }, 3000);
                }
            } else {
                const normalizedInput = window.normalizeWA(input);
                const customerData = window.allServerData.filter(d => d.wa && window.normalizeWA(d.wa) === normalizedInput);
                if (customerData.length > 0) {
                    window.handleLoginSuccess(customerData, normalizedInput);
                } else {
                    errorDiv.textContent = 'Nomor WA salah atau belum terdaftar!'; errorDiv.classList.remove('hidden');
                    setTimeout(() => { errorDiv.classList.add('hidden'); }, 3000);
                }
            }
        };

        // --- BIOMETRIK ---
        function bufferToBase64url(buffer) {
            const bytes = new Uint8Array(buffer); let str = '';
            for (let char of bytes) str += String.fromCharCode(char);
            return window.btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
        }
        function base64urlToBuffer(base64url) {
            const padding = '='.repeat((4 - base64url.length % 4) % 4);
            const base64 = (base64url + padding).replace(/\-/g, "+").replace(/_/g, "/");
            const str = window.atob(base64); const buffer = new ArrayBuffer(str.length);
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i);
            return buffer;
        }

        window.registerBiometrics = async function() {
            if (!window.PublicKeyCredential) { alert("Perangkat ini tidak mendukung fitur Sidik Jari."); return; }
            try {
                const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
                const userID = new Uint8Array(16); window.crypto.getRandomValues(userID);
                const publicKey = { challenge: challenge, rp: { name: "OZfinance System" }, user: { id: userID, name: window.currentLoggedWA, displayName: "Nasabah" }, pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }], authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }, timeout: 60000 };
                const credential = await navigator.credentials.create({ publicKey });
                localStorage.setItem(BIO_CRED_KEY, bufferToBase64url(credential.rawId));
                localStorage.setItem(BIO_WA_KEY, window.currentLoggedWA);
                alert("Sidik Jari / FaceID Berhasil Didaftarkan!");
            } catch (err) { alert("Pendaftaran Biometrik dibatalkan."); }
        };

        window.loginWithBiometrics = async function() {
            const savedId = localStorage.getItem(BIO_CRED_KEY); const savedWa = localStorage.getItem(BIO_WA_KEY);
            if(!savedId || !savedWa) { alert("Perangkat ini belum terdaftar. Login manual dengan WA, lalu aktifkan di Profil Saya."); return; }
            try {
                const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
                const publicKey = { challenge: challenge, allowCredentials: [{ type: 'public-key', id: base64urlToBuffer(savedId) }], userVerification: "required" };
                await navigator.credentials.get({ publicKey });
                const customerData = window.allServerData.filter(d => d.wa && window.normalizeWA(d.wa) === window.normalizeWA(savedWa));
                if (customerData.length > 0) { window.handleLoginSuccess(customerData, savedWa); } else { alert("Data tidak ditemukan."); }
            } catch(err) { alert("Gagal memindai biometrik. Silakan ketik Nomor WA."); }
        };

        // --- UPLOAD FOTO ---
        document.getElementById('profile-upload').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader(); reader.readAsDataURL(file);
            reader.onload = function(event) {
                const img = new Image(); img.src = event.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas'); const scaleSize = 150 / img.width;
                    canvas.width = 150; canvas.height = img.height * scaleSize;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    window.temporaryBase64Photo = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('profile-img-preview').src = window.temporaryBase64Photo;
                }
            };
        });

        // --- DASHBOARD RENDER & FORMS ---
        window.formatRp = function(angka) { return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka); };
        window.getProgressColor = function(percent) { return percent === 0 ? 'from-red-600 to-orange-500' : percent < 50 ? 'from-orange-500 to-yellow-500' : percent < 80 ? 'from-yellow-500 to-yellow-400' : percent < 100 ? 'from-yellow-400 to-yellow-300' : 'from-green-500 to-green-400'; };

        window.renderDashboard = function() {
            const groupedData = window.appData.reduce(function(acc, currentItem) {
                if(!currentItem || !currentItem.name) return acc;
                const nameKey = String(currentItem.name).trim().toUpperCase();
                if (!acc[nameKey]) acc[nameKey] = { name: String(currentItem.name), items: [], photo: currentItem.photo };
                acc[nameKey].items.push(currentItem);
                return acc;
            }, {});
            const customers = Object.values(groupedData);
            document.getElementById('total-nasabah').textContent = `${customers.length} Nasabah`;
            
            let htmlContent = '';
            customers.forEach(function(customer) {
                let itemsHtml = ''; let totalTagihanNasabah = 0;
                let avatarSrc = customer.photo ? customer.photo : `https://ui-avatars.com/api/?name=${encodeURIComponent(customer.name)}&background=fde047&color=000`;

                customer.items.forEach(function(item) {
                    totalTagihanNasabah += parseInt(item.tagihan) || 0;
                    const progressPercent = (item.lunas / (item.totalBulan || 1)) * 100;
                    const isLunas = progressPercent >= 100;
                    const colorClass = window.getProgressColor(progressPercent);
                    const editBtn = !window.isReadOnly ? `<button type="button" onclick="window.openEditModal('${item.id}')" class="absolute top-3 right-3 text-gray-500 hover:text-yellow-400 z-10"><i class="fa-solid fa-pen-to-square text-sm"></i></button>` : '';
                    const historyHtml = item.history ? `<div class="mt-2 p-2 bg-black/40 rounded border border-white/5 text-[10px] text-gray-400 whitespace-pre-line leading-relaxed"><i class="fa-solid fa-clock-rotate-left mr-1"></i> ${item.history}</div>` : '';

                    itemsHtml += `<div class="bg-gray-900/50 rounded-xl p-3 border border-white/5 relative group/item transition-colors hover:bg-gray-800/80">${editBtn}<div class="pr-8 mb-2"><h3 class="text-yellow-400 text-sm font-bold flex items-center gap-1.5"><i class="fa-solid ${isLunas ? 'fa-check-circle text-green-500' : 'fa-box-open'}"></i> ${item.item || '-'}</h3></div><div class="flex justify-between text-xs mb-2"><span class="text-gray-400"><i class="fa-regular fa-calendar mr-1"></i> ${item.jatuhTempo || '-'}</span><span class="text-white font-medium">${window.formatRp(item.tagihan)}/bln</span></div><div class="flex justify-between text-[10px] uppercase font-bold tracking-wider text-gray-400 mb-1.5"><span>Status: ${isLunas ? 'LUNAS' : item.lunas + '/' + item.totalBulan + ' BLN'}</span><span class="${isLunas ? 'text-green-500' : 'text-yellow-500'}">${progressPercent.toFixed(0)}%</span></div><div class="w-full h-1.5 bg-gray-700 rounded-full overflow-hidden shadow-inner"><div class="h-full bg-gradient-to-r ${colorClass} rounded-full shimmer progress-fill" style="width: 0%" data-target="${progressPercent > 100 ? 100 : progressPercent}%"></div></div>${historyHtml}</div>`;
                });
                
                // SHARE LINK MODERN: Langsung menggunakan URL Vercel bawaan (sangat pendek)
                const shareBtn = !window.isReadOnly ? `<button type="button" onclick="window.openShareModal('${customer.items[0].wa}')" class="w-8 h-8 rounded-full bg-yellow-500/20 text-yellow-400 hover:bg-yellow-500 hover:text-black transition-colors flex items-center justify-center shrink-0"><i class="fa-solid fa-share-nodes text-sm"></i></button>` : '';
                
                htmlContent += `<div class="glass-card rounded-2xl flex flex-col relative overflow-hidden w-full flex-shrink-0 snap-center"><div class="p-4 border-b border-yellow-500/20 bg-black/20 flex items-center justify-between gap-3"><div class="flex items-center gap-3"><div class="w-11 h-11 rounded-full border border-yellow-500/30 overflow-hidden bg-gray-800 shrink-0"><img src="${avatarSrc}" class="w-full h-full object-cover"></div><div><h2 class="text-lg font-bold text-white leading-tight">${customer.name}</h2><p class="text-xs text-gray-400">${customer.items.length} Item Aktif</p></div></div>${shareBtn}</div><div class="p-4 flex-1 flex flex-col gap-3 custom-scroll max-h-[50vh] overflow-y-auto">${itemsHtml}</div><div class="p-4 border-t border-white/5 bg-gray-900/60 flex justify-between items-center mt-auto"><span class="text-xs text-gray-400 font-medium">Total Tagihan/Bln</span><span class="text-base font-bold text-yellow-400">${window.formatRp(totalTagihanNasabah)}</span></div></div>`;
            });

            document.getElementById('dashboard-grid').innerHTML = htmlContent;
            document.getElementById('carousel-indicators').innerHTML = Array(customers.length).fill('<div class="carousel-dot w-2 h-2 rounded-full bg-gray-600 transition-all duration-300"></div>').join('');
            window.updateCarouselIndicator();
            setTimeout(() => { document.querySelectorAll('.progress-fill').forEach(bar => { bar.style.width = bar.getAttribute('data-target'); }); }, 100);
        };

        window.openShareModal = function(waNumber) { 
            if(!waNumber) { alert("Nasabah ini belum memiliki nomor WA. Silakan isi terlebih dahulu."); return; }
            // Membuat link Vercel Super Pendek
            const currentOrigin = window.location.origin + window.location.pathname;
            const finalUrl = currentOrigin + "?wa=" + window.normalizeWA(waNumber);
            document.getElementById('share-link-input').value = finalUrl; 
            document.getElementById('share-modal').classList.remove('opacity-0', 'pointer-events-none'); 
            document.getElementById('share-modal-content').classList.remove('scale-95'); 
            document.getElementById('share-modal-content').classList.add('scale-100'); 
        };
        window.closeShareModal = function() { document.getElementById('share-modal').classList.add('opacity-0', 'pointer-events-none'); document.getElementById('share-modal-content').classList.remove('scale-100'); document.getElementById('share-modal-content').classList.add('scale-95'); };
        window.copyShareLink = function() { document.getElementById('share-link-input').select(); document.execCommand('copy'); const btn = document.getElementById('copy-btn'); btn.innerHTML = '<i class="fa-solid fa-check"></i> Tersalin'; setTimeout(() => { btn.innerHTML = '<i class="fa-solid fa-copy"></i> Salin'; }, 2000); };
        
        window.resetDeleteBtn = function() { const btn = document.getElementById('btn-hapus'); btn.setAttribute('data-confirm', 'false'); btn.innerHTML = '<i class="fa-solid fa-trash"></i>'; btn.className = "flex px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-sm font-medium shrink-0 items-center gap-2"; };
        window.handleDeleteClick = function() { const btn = document.getElementById('btn-hapus'); if (btn.getAttribute('data-confirm') === 'true') { window.allServerData = window.allServerData.filter(d => String(d.id) !== String(document.getElementById('form-id').value)); window.appData = window.allServerData; window.saveAppDataFirebase(); window.closeModal(); window.renderDashboard(); } else { btn.setAttribute('data-confirm', 'true'); btn.innerHTML = '<i class="fa-solid fa-question"></i> Yakin?'; btn.classList.replace('bg-red-600', 'bg-red-800'); clearTimeout(deleteConfirmTimeout); deleteConfirmTimeout = setTimeout(window.resetDeleteBtn, 3000); } };
        
        window.openAddModal = function() { if(window.isReadOnly) return; document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-user-plus text-yellow-400 mr-2"></i> Tambah Nasabah'; document.getElementById('data-form').reset(); document.getElementById('form-id').value = ''; document.getElementById('form-lunas').value = '0'; document.getElementById('form-wa').value = ''; document.getElementById('form-history').value = ''; document.getElementById('btn-hapus').classList.add('hidden'); document.getElementById('btn-hapus').classList.remove('flex'); document.getElementById('form-modal').classList.remove('opacity-0', 'pointer-events-none'); document.getElementById('form-modal-content').classList.remove('scale-95'); document.getElementById('form-modal-content').classList.add('scale-100'); };
        window.openEditModal = function(id) { if(window.isReadOnly) return; const item = window.appData.find(d => String(d.id) === String(id)); if (!item) return; document.getElementById('modal-title').innerHTML = '<i class="fa-solid fa-pen-to-square text-yellow-400 mr-2"></i> Edit Data'; document.getElementById('form-id').value = item.id; document.getElementById('form-name').value = item.name; document.getElementById('form-item').value = item.item; document.getElementById('form-tagihan').value = item.tagihan; document.getElementById('form-jatuh-tempo').value = item.jatuhTempo; document.getElementById('form-total-bulan').value = item.totalBulan; document.getElementById('form-lunas').value = item.lunas; document.getElementById('form-wa').value = item.wa || ""; document.getElementById('form-history').value = item.history || ""; window.resetDeleteBtn(); document.getElementById('form-modal').classList.remove('opacity-0', 'pointer-events-none'); document.getElementById('form-modal-content').classList.remove('scale-95'); document.getElementById('form-modal-content').classList.add('scale-100'); };
        
        document.getElementById('form-name').addEventListener('input', function(e) { const typedName = e.target.value.trim().toLowerCase(); const existingCustomer = window.appData.find(d => d.name.trim().toLowerCase() === typedName && d.wa && d.wa.trim() !== ""); if (existingCustomer) { document.getElementById('form-wa').value = existingCustomer.wa; } });
        
        window.autoAddHistory = function() { const historyField = document.getElementById('form-history'); const lunasField = document.getElementById('form-lunas'); const tagihanField = document.getElementById('form-tagihan'); const totalBulanField = document.getElementById('form-total-bulan'); const date = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); const nominal = window.formatRp(tagihanField.value || 0); let currentBulan = parseInt(lunasField.value) || 0; const totalBulan = parseInt(totalBulanField.value) || 1; if(currentBulan >= totalBulan) { alert("Cicilan ini sudah lunas sepenuhnya."); return; } const nextBulan = currentBulan + 1; const newEntry = `${date} - Bayar Bln ke-${nextBulan} (${nominal})`; historyField.value = historyField.value.trim() === '' ? newEntry : historyField.value + '\n' + newEntry; lunasField.value = nextBulan; };
        window.closeModal = function() { document.getElementById('form-modal').classList.add('opacity-0', 'pointer-events-none'); document.getElementById('form-modal-content').classList.remove('scale-100'); document.getElementById('form-modal-content').classList.add('scale-95'); };
        window.slideCarousel = function(direction) { const container = document.getElementById('dashboard-grid'); container.scrollBy({ left: direction * container.clientWidth, behavior: 'smooth' }); };
        window.updateCarouselIndicator = function() { const container = document.getElementById('dashboard-grid'); const dots = document.querySelectorAll('.carousel-dot'); if(!dots.length) return; const index = Math.round(container.scrollLeft / container.clientWidth); dots.forEach((dot, i) => { if (i === index) { dot.classList.replace('bg-gray-600', 'bg-yellow-400'); dot.classList.replace('w-2', 'w-6'); } else { dot.classList.replace('bg-yellow-400', 'bg-gray-600'); dot.classList.replace('w-6', 'w-2'); } }); };
        
        window.openProfileModal = function() { if(!window.currentLoggedWA) return; const cData = window.appData.find(d => window.normalizeWA(d.wa) === window.currentLoggedWA); if(!cData) return; document.getElementById('profile-name-input').value = cData.name; document.getElementById('profile-wa-input').value = cData.wa; window.temporaryBase64Photo = cData.photo || null; document.getElementById('profile-img-preview').src = window.temporaryBase64Photo ? window.temporaryBase64Photo : `https://ui-avatars.com/api/?name=${encodeURIComponent(cData.name)}&background=fde047&color=000&size=150`; document.getElementById('profile-modal').classList.remove('opacity-0', 'pointer-events-none'); document.getElementById('profile-modal-content').classList.remove('scale-95'); document.getElementById('profile-modal-content').classList.add('scale-100'); };
        window.closeProfileModal = function() { document.getElementById('profile-modal').classList.add('opacity-0', 'pointer-events-none'); document.getElementById('profile-modal-content').classList.remove('scale-100'); document.getElementById('profile-modal-content').classList.add('scale-95'); };
        
        window.submitProfileForm = function() {
            const newName = document.getElementById('profile-name-input').value.trim();
            if(window.allServerData.length > 0) { window.allServerData.forEach(d => { if(window.normalizeWA(d.wa) === window.currentLoggedWA) { d.name = newName; d.photo = window.temporaryBase64Photo || ""; } }); }
            window.appData.forEach(d => { if(window.normalizeWA(d.wa) === window.currentLoggedWA) { d.name = newName; d.photo = window.temporaryBase64Photo || ""; } });
            window.saveAppDataFirebase(); window.closeProfileModal(); window.renderDashboard();
        };

        window.submitDataFormAction = function() {
            const idVal = document.getElementById('form-id').value; const name = document.getElementById('form-name').value.trim(); const wa = document.getElementById('form-wa').value.trim(); const item = document.getElementById('form-item').value.trim(); const tagihan = parseInt(document.getElementById('form-tagihan').value) || 0; const jatuhTempo = document.getElementById('form-jatuh-tempo').value.trim(); const totalBulan = parseInt(document.getElementById('form-total-bulan').value) || 1; let lunas = parseInt(document.getElementById('form-lunas').value) || 0; const history = document.getElementById('form-history').value.trim(); if(lunas > totalBulan) lunas = totalBulan;
            let existingPhoto = ""; const existingCustomer = window.allServerData.find(d => window.normalizeWA(d.wa) === window.normalizeWA(wa)); if(existingCustomer) existingPhoto = existingCustomer.photo;
            if (idVal) {
                const itemIndex = window.allServerData.findIndex(d => String(d.id) === String(idVal));
                if(itemIndex !== -1) window.allServerData[itemIndex] = { id: window.allServerData[itemIndex].id, name, item, tagihan, totalBulan, lunas, jatuhTempo, history, wa, photo: existingPhoto };
            } else { window.allServerData.push({ id: Date.now(), name, wa, item, tagihan, totalBulan, lunas, jatuhTempo, history, photo: existingPhoto }); }
            window.allServerData.forEach(d => { if(window.normalizeWA(d.wa) === window.normalizeWA(wa)) { d.name = name; d.wa = wa; } });
            window.appData = window.allServerData; window.saveAppDataFirebase(); window.closeModal(); window.renderDashboard();
        };

        window.openPwdModal = function() { document.getElementById('pwd-old').value = ''; document.getElementById('pwd-new').value = ''; document.getElementById('pwd-error').classList.add('hidden'); document.getElementById('pwd-success').classList.add('hidden'); document.getElementById('pwd-modal').classList.remove('opacity-0', 'pointer-events-none'); document.getElementById('pwd-modal-content').classList.remove('scale-95'); document.getElementById('pwd-modal-content').classList.add('scale-100'); };
        window.closePwdModal = function() { document.getElementById('pwd-modal').classList.add('opacity-0', 'pointer-events-none'); document.getElementById('pwd-modal-content').classList.remove('scale-100'); document.getElementById('pwd-modal-content').classList.add('scale-95'); };
        window.submitPwdAction = function() { if (document.getElementById('pwd-old').value !== window.adminPassword) { document.getElementById('pwd-error').textContent = "Password lama salah!"; document.getElementById('pwd-error').classList.remove('hidden'); return; } window.adminPassword = document.getElementById('pwd-new').value; localStorage.setItem(PWD_STORAGE_KEY, window.adminPassword); document.getElementById('pwd-success').classList.remove('hidden'); setTimeout(window.closePwdModal, 1500); };
    </script>
</body>
