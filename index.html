<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZfinance Super Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- PWA CONFIGURATION & MANIFEST -->
    <meta name="theme-color" content="#fde047">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://dl.dropboxusercontent.com/scl/fi/b3vvowv2tpjz7x4tl5kq0/OZ.png?rlkey=e2oamdv1tprgrdf5j2kjpgu46&st=368naga4&dl=0">
    <link id="dynamic-manifest" rel="manifest" href="">

    <!-- FIREBASE COMPAT SDK (ANTI CRASH MODULE) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <style>
        body { background: linear-gradient(-45deg, #000000, #111827, #1f2937, #000000); background-size: 400% 400%; animation: gradientBG 15s ease infinite; color: #f8fafc; min-height: 100vh; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .glass-panel { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 204, 0, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); }
        .glass-card { background: rgba(31, 41, 55, 0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
        .progress-fill { transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .shimmer { position: relative; overflow: hidden; }
        .shimmer::after { content: ''; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%); transform: translateX(-100%); animation: shimmer 2.5s infinite; }
        @keyframes shimmer { 100% { transform: translateX(100%); } }
        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 204, 0, 0.2); border-radius: 10px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        html { scroll-behavior: smooth; }
    </style>
</head>
<body class="p-4 md:p-8 font-sans antialiased relative">

    <div id="loading-overlay" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[200] flex-col items-center justify-center transition-opacity duration-300" style="display: flex;">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl text-yellow-400 mb-4 drop-shadow-[0_0_15px_rgba(255,204,0,0.5)]"></i>
        <p id="loading-text" class="text-white font-bold text-sm tracking-widest animate-pulse uppercase">Memuat Server...</p>
    </div>

    <!-- Login Screen -->
    <div id="auth-screen" class="fixed inset-0 bg-black/95 z-[100] flex items-center justify-center transition-opacity duration-500" style="display: flex;">
        <div class="glass-panel p-8 rounded-3xl max-w-sm w-full mx-4 text-center border border-yellow-500/20 relative overflow-hidden">
            <img src="https://dl.dropboxusercontent.com/scl/fi/b3vvowv2tpjz7x4tl5kq0/OZ.png?rlkey=e2oamdv1tprgrdf5j2kjpgu46&st=368naga4&dl=0" alt="OZ Logo" class="w-20 h-20 mx-auto mb-4 object-contain drop-shadow-[0_0_15px_rgba(253,224,38,0.6)]">
            
            <h2 id="auth-title" class="text-2xl font-bold text-white mb-2">Login Nasabah</h2>
            <p id="auth-subtitle" class="text-gray-400 text-sm mb-6">Masukkan Nomor WhatsApp Anda.</p>
            
            <div class="flex p-1 bg-gray-900/80 rounded-lg mb-6 border border-gray-700 relative z-10">
                <button type="button" id="tab-nasabah" onclick="window.switchTab('nasabah')" class="flex-1 py-2 text-sm font-bold rounded-md bg-yellow-500 text-black shadow transition-all">Nasabah</button>
                <button type="button" id="tab-admin" onclick="window.switchTab('admin')" class="flex-1 py-2 text-sm font-bold rounded-md text-gray-400 hover:text-white transition-all">Admin</button>
            </div>

            <form id="auth-form" onsubmit="event.preventDefault(); window.processLoginAction(); return false;" class="space-y-4 relative z-10">
                <input type="number" id="auth-input" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white text-center tracking-widest focus:outline-none focus:border-yellow-400 transition-colors" placeholder="Contoh: 0812... atau 628..." required>
                
                <div id="auth-error" class="text-red-400 text-xs font-medium bg-red-500/10 py-2 rounded-lg border border-red-500/20" style="display: none;">Nomor WA tidak terdaftar!</div>
                
                <div class="grid grid-cols-1 gap-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-400 text-black font-bold py-3 rounded-xl shadow-[0_0_15px_rgba(255,204,0,0.3)] hover:scale-105 transition-transform flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-to-bracket"></i> Masuk
                    </button>
                    <!-- Biometrik Muncul untuk Nasabah & Admin -->
                    <button type="button" id="btn-biometric-login" onclick="window.loginWithBiometrics()" class="w-full bg-gray-800 border border-gray-700 text-white font-bold py-3 rounded-xl hover:border-yellow-400 hover:text-yellow-400 transition-colors items-center justify-center gap-2" style="display: flex;">
                        <i class="fa-solid fa-fingerprint text-lg"></i> Sidik Jari / FaceID
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto glass-panel rounded-3xl p-6 md:p-10">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <div class="text-center md:text-left flex-1">
                <div class="flex items-center justify-center md:justify-start gap-3 mb-2">
                    <img src="https://dl.dropboxusercontent.com/scl/fi/b3vvowv2tpjz7x4tl5kq0/OZ.png?rlkey=e2oamdv1tprgrdf5j2kjpgu46&st=368naga4&dl=0" alt="OZ Logo" class="w-10 h-10 object-contain drop-shadow-[0_0_8px_rgba(253,224,38,0.5)]">
                    <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-yellow-200">OZfinance</h1>
                </div>
            </div>
            
            <div id="header-actions" class="flex items-center gap-3 flex-wrap justify-center">
                <!-- Kolom Pencarian Admin -->
                <div class="relative">
                    <input type="text" id="search-input" onkeyup="window.searchNasabah()" placeholder="Cari Nama / WA..." class="bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 pl-10 text-white text-sm focus:outline-none focus:border-yellow-400 w-full sm:w-64 transition-all" style="display: none;">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-500" id="search-icon" style="display: none;"></i>
                </div>

                <!-- Tombol Install PWA -->
                <button type="button" id="btn-install-pwa" onclick="window.triggerInstallPrompt()" class="bg-yellow-500/20 border border-yellow-500/50 hover:bg-yellow-500 hover:text-black text-yellow-400 px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 h-11 transition-all" style="display: none;"><i class="fa-solid fa-download"></i> Install Aplikasi</button>
                
                <button type="button" id="btn-profile" onclick="window.openProfileModal()" class="bg-gray-800 border border-gray-700 hover:border-yellow-400 text-gray-400 hover:text-yellow-400 px-4 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 h-11 transition-all" style="display: none;"><i class="fa-solid fa-user-circle text-lg"></i> Profil Saya</button>
                
                <div id="admin-actions" class="flex items-center gap-3" style="display: flex;">
                    <button type="button" onclick="window.openPwdModal()" class="w-11 h-11 rounded-xl bg-gray-800 border border-gray-700 hover:border-yellow-400 text-gray-400 hover:text-yellow-400 flex items-center justify-center transition-all shadow-lg" title="Ganti Password & Fingerprint"><i class="fa-solid fa-key"></i></button>
                    <button type="button" onclick="window.openAddModal()" class="bg-gradient-to-r from-yellow-500 to-yellow-400 text-gray-900 px-5 py-2.5 rounded-xl text-sm font-bold flex items-center gap-2 h-11"><i class="fa-solid fa-user-plus"></i> Nasabah Baru</button>
                </div>
            </div>
        </div>

        <div class="relative group/carousel">
            <!-- Grid Container (Tombol Panah Dihapus) -->
            <div id="dashboard-grid" class="flex flex-row overflow-x-auto snap-x snap-mandatory gap-6 no-scrollbar pb-2" onscroll="window.updateCarouselIndicator()"></div>
        </div>
        <div id="carousel-indicators" class="flex justify-center gap-2 mt-4 flex-wrap"></div>
    </div>

    <!-- PROFILE MODAL (NASABAH) -->
    <div id="profile-modal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-[150] flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 transform scale-95 transition-transform duration-300 bg-gray-900" id="profile-modal-content">
            <div class="flex justify-between items-center mb-6 border-b border-white/10 pb-3">
                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-user-edit text-yellow-400 mr-2"></i> Edit Profil</h3>
                <button type="button" onclick="window.closeProfileModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            
            <form id="profile-form" onsubmit="event.preventDefault(); window.submitProfileForm(); return false;" class="space-y-5">
                <div class="flex flex-col items-center gap-3">
                    <div class="relative group cursor-pointer w-24 h-24 rounded-full overflow-hidden border-2 border-yellow-500/50 hover:border-yellow-400 transition-colors">
                        <img id="profile-img-preview" src="https://via.placeholder.com/150/1f2937/f8fafc?text=Foto" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <i class="fa-solid fa-camera text-white text-xl"></i>
                        </div>
                        <input type="file" id="profile-upload" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    </div>
                    <p class="text-[10px] text-gray-500">Ketuk untuk ubah foto</p>
                </div>

                <div><label class="block text-xs text-gray-400 mb-1">Nama Tampilan Anda</label><input type="text" id="profile-name-input" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-yellow-400 text-sm" required></div>
                
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nomor WhatsApp (Terkunci)</label>
                    <div class="relative">
                        <input type="text" id="profile-wa-input" class="w-full bg-gray-900 border border-gray-800 rounded-lg px-4 py-2.5 text-gray-500 text-sm cursor-not-allowed" readonly>
                        <i class="fa-solid fa-lock absolute right-4 top-1/2 -translate-y-1/2 text-gray-600"></i>
                    </div>
                    <p class="text-[9px] text-red-400/80 mt-1">*Hanya admin yang dapat mengubah nomor WA.</p>
                </div>

                <button type="button" onclick="window.registerBiometrics('nasabah')" class="w-full bg-blue-600/20 border border-blue-500/50 hover:bg-blue-600/40 text-blue-400 rounded-lg py-2.5 text-xs font-bold transition-colors flex justify-center items-center gap-2">
                    <i class="fa-solid fa-fingerprint"></i> Daftarkan Perangkat Ini (Biometrik)
                </button>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-gradient-to-r from-yellow-500 to-yellow-400 text-black rounded-xl py-3 text-sm font-bold shadow-lg transform hover:-translate-y-0.5 transition-all">Simpan Profil</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Edit/Add Modal (Admin) -->
    <div id="form-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="glass-panel w-full max-w-md rounded-2xl p-6 transform scale-95 transition-transform duration-300 bg-gray-900 custom-scroll max-h-[95vh] overflow-y-auto" id="form-modal-content">
            <div class="flex justify-between items-center mb-5 border-b border-white/10 pb-3 sticky top-0 bg-gray-900 z-10">
                <h3 id="modal-title" class="text-lg font-bold text-white"><i class="fa-solid fa-pen-to-square text-yellow-400 mr-2"></i> Edit Data</h3>
                <button type="button" onclick="window.closeModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            <form id="data-form" onsubmit="event.preventDefault(); window.submitDataFormAction(); return false;" class="space-y-4">
                <input type="hidden" id="form-id">
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-xs text-gray-400 mb-1">Nama Asli Nasabah</label><input type="text" id="form-name" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-400 text-sm" required></div>
                    <div><label class="block text-xs text-gray-400 mb-1">No. WA (Admin Bisa Edit)</label><input type="number" id="form-wa" placeholder="08123..." class="w-full bg-gray-800 border border-yellow-500/30 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-400 text-sm"></div>
                </div>
                <div><label class="block text-xs text-gray-400 mb-1">Jenis Cicilan / Item</label><input type="text" id="form-item" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-400 text-sm" required></div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-xs text-gray-400 mb-1">Tagihan/Bulan (Rp)</label><input type="number" id="form-tagihan" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-400 text-sm" required></div>
                    <div><label class="block text-xs text-gray-400 mb-1">Jatuh Tempo</label><input type="text" id="form-jatuh-tempo" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-400 text-sm" required></div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="block text-xs text-gray-400 mb-1">Total Tenor (Bulan)</label><input type="number" id="form-total-bulan" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-yellow-400 text-sm" required></div>
                    <div><label class="block text-xs text-gray-400 mb-1">Sudah Lunas (Bulan)</label><input type="number" id="form-lunas" class="w-full bg-gray-800 border border-yellow-500/50 rounded-lg px-3 py-2 text-yellow-400 font-bold focus:outline-none focus:border-yellow-400 text-sm" required></div>
                </div>
                <div class="pt-2 border-t border-gray-800">
                    <div class="flex justify-between items-end mb-1">
                        <label class="block text-xs text-gray-400">Riwayat Pembayaran</label>
                        <button type="button" onclick="window.autoAddHistory()" class="text-[10px] bg-yellow-500/20 text-yellow-400 hover:bg-yellow-500 hover:text-black font-bold px-2 py-1 rounded transition-colors flex items-center gap-1"><i class="fa-solid fa-bolt"></i> Catat Hari Ini</button>
                    </div>
                    <textarea id="form-history" rows="3" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-gray-300 focus:outline-none focus:border-yellow-400 text-xs custom-scroll leading-relaxed"></textarea>
                </div>
                <div class="pt-4 flex gap-3 sticky bottom-0 bg-gray-900 pb-2">
                    <button type="button" id="btn-hapus" onclick="window.handleDeleteClick()" data-confirm="false" class="bg-red-600 hover:bg-red-500 text-white rounded-xl text-sm font-medium shrink-0 items-center gap-2 px-4 py-2" style="display: none;"><i class="fa-solid fa-trash"></i></button>
                    <button type="button" onclick="window.closeModal()" class="flex-1 px-4 py-2 bg-gray-700 hover:bg-gray-600 text-white rounded-xl text-sm font-medium">Batal</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-gradient-to-r from-yellow-500 to-yellow-400 text-gray-900 rounded-xl text-sm font-bold shadow-lg transform hover:-translate-y-0.5 transition-all">Simpan</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Modal Password Admin + Fingerprint -->
    <div id="pwd-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300 p-4">
        <div class="glass-panel w-full max-w-sm rounded-2xl p-6 transform scale-95 transition-transform duration-300 bg-gray-900 border border-yellow-500/20" id="pwd-modal-content">
            <div class="flex justify-between items-center mb-5 border-b border-white/10 pb-3">
                <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-key text-yellow-400 mr-2"></i> Keamanan Admin</h3>
                <button type="button" onclick="window.closePwdModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-times text-xl"></i></button>
            </div>
            
            <form onsubmit="event.preventDefault(); window.submitPwdAction(); return false;" class="space-y-4">
                <div><label class="block text-xs text-gray-400 mb-1">Password Lama</label><input type="password" id="pwd-old" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm" required></div>
                <div><label class="block text-xs text-gray-400 mb-1">Password Baru</label><input type="password" id="pwd-new" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-white text-sm" required></div>
                <div id="pwd-error" class="text-red-400 text-xs font-medium bg-red-500/10 py-2 rounded-lg text-center" style="display: none;"></div>
                <div id="pwd-success" class="text-green-400 text-xs font-bold bg-green-500/10 py-2 rounded-lg text-center" style="display: none;">Tersimpan!</div>
                
                <button type="button" onclick="window.registerBiometrics('admin')" class="w-full bg-blue-600/20 border border-blue-500/50 hover:bg-blue-600/40 text-blue-400 rounded-lg py-2.5 text-xs font-bold transition-colors flex justify-center items-center gap-2 mt-2">
                    <i class="fa-solid fa-fingerprint"></i> Daftarkan Sidik Jari Admin
                </button>

                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="window.closePwdModal()" class="flex-1 px-4 py-2 bg-gray-700 text-white rounded-xl text-sm font-medium">Batal</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-gradient-to-r from-yellow-500 to-yellow-400 text-gray-900 rounded-xl text-sm font-bold">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // INISIALISASI PWA OTOMATIS
        document.addEventListener("DOMContentLoaded", function() {
            const manifestData = {
                "name": "OZfinance Super Dashboard",
                "short_name": "OZfinance",
                "start_url": "./index.html",
                "display": "standalone",
                "background_color": "#000000",
                "theme_color": "#fde047",
                "icons": [
                    { "src": "https://dl.dropboxusercontent.com/scl/fi/b3vvowv2tpjz7x4tl5kq0/OZ.png?rlkey=e2oamdv1tprgrdf5j2kjpgu46&st=368naga4&dl=0", "sizes": "192x192", "type": "image/png" },
                    { "src": "https://dl.dropboxusercontent.com/scl/fi/b3vvowv2tpjz7x4tl5kq0/OZ.png?rlkey=e2oamdv1tprgrdf5j2kjpgu46&st=368naga4&dl=0", "sizes": "512x512", "type": "image/png" }
                ]
            };
            const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
            document.getElementById('dynamic-manifest').href = URL.createObjectURL(manifestBlob);

            if ('serviceWorker' in navigator) {
                const swCode = `self.addEventListener('install', e => { self.skipWaiting(); }); self.addEventListener('activate', e => { self.clients.claim(); }); self.addEventListener('fetch', e => { e.respondWith(fetch(e.request).catch(() => caches.match(e.request))); });`;
                const swBlob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(err => console.log('SW registration failed:', err));
            }
            
            if (!window.matchMedia('(display-mode: standalone)').matches) {
                document.getElementById('btn-install-pwa').style.display = 'flex';
            }
        });

        // HANDLE TOMBOL INSTALL PWA
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        window.triggerInstallPrompt = async function() {
            if (!deferredPrompt) {
                alert("Untuk Menginstal: Ketuk menu browser Chrome/Safari (titik tiga), lalu pilih 'Tambahkan ke Layar Utama' (Add to Home Screen).");
                return;
            }
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                document.getElementById('btn-install-pwa').style.display = 'none';
            }
            deferredPrompt = null;
        };

        // INISIALISASI VARIABEL GLOBAL
        window.allServerData = [];
        window.appData = [];
        window.isReadOnly = false;
        window.adminPassword = localStorage.getItem('ozfinance_admin_pwd') || "0000";
        window.loginMode = 'nasabah';
        window.currentLoggedWA = null;
        window.temporaryBase64Photo = null;
        let deleteConfirmTimeout;

        window.normalizeWA = function(num) {
            if (!num) return "";
            let str = String(num).replace(/\D/g, ''); 
            if (str.startsWith('08')) str = '62' + str.substring(1); 
            return str;
        };

        window.showLoading = function(text) { 
            document.getElementById('loading-text').innerText = text || "Memproses..."; 
            document.getElementById('loading-overlay').style.display = 'flex'; 
        };
        window.hideLoading = function() { 
            document.getElementById('loading-overlay').style.display = 'none'; 
        };

        // KONFIGURASI FIREBASE MENGGUNAKAN SDK COMPAT
        const firebaseConfig = {
            apiKey: "AIzaSyBkHkY6dAYWppYWRFPRum2bwx2Dgnk8pV4",
            authDomain: "ozfinance-5fb9c.firebaseapp.com",
            databaseURL: "https://ozfinance-5fb9c-default-rtdb.asia-southeast1.firebasedatabase.app/", 
            projectId: "ozfinance-5fb9c",
            storageBucket: "ozfinance-5fb9c.firebasestorage.app",
            messagingSenderId: "53300038907",
            appId: "1:53300038907:web:2157b566d33b5bdbea745e"
        };

        let dbRef;
        try {
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();

        function base64urlToBuffer(base64url) { const padding = '='.repeat((4 - base64url.length % 4) % 4); const base64 = (base64url + padding).replace(/\-/g, "+").replace(/_/g, "/"); const str = window.atob(base64); const buffer = new ArrayBuffer(str.length); const bytes = new Uint8Array(buffer); for (let i = 0; i < str.length; i++) bytes[i] = str.charCodeAt(i); return buffer; }
        
        window.registerBiometrics = async function(role) {
            if (!window.PublicKeyCredential) { alert("Perangkat Anda tidak mendukung fitur WebAuthn/Sidik Jari."); return; }
            try {
                const challenge = new Uint8Array(32); window.crypto.getRandomValues(challenge);
                const userID = new Uint8Array(16); window.crypto.getRandomValues(userID);
                
                const uName = role === 'admin' ? "Admin OZfinance" : window.currentLoggedWA;
                const dName = role === 'admin' ? "Administrator" : "Nasabah";

                const publicKey = { challenge: challenge, rp: { name: "OZfinance System" }, user: { id: userID, name: uName, displayName: dName }, pubKeyCredParams: [{ type: "public-key", alg: -7 }, { type: "public-key", alg: -257 }], authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }, timeout: 60000 };
                const credential = await navigator.credentials.create({ publicKey });
                
                if (role === 'admin') {
                    localStorage.setItem('oz_biometric_admin_id', bufferToBase64url(credential.rawId));
                    alert("Sidik Jari Admin Berhasil Didaftarkan!");
                } else {
                    localStorage.setItem('oz_biometric_id', bufferToBase64url(credential.rawId)); 
                    localStorage.setItem('oz_biometric_wa', window.currentLoggedWA);
                    alert("Sidik Jari Nasabah Berhasil Didaftarkan!");

        };

        window.submitDataFormAction = function() {
            const idVal = document.getElementById('form-id').value; const name = document.getElementById('form-name').value.trim(); const wa = document.getElementById('form-wa').value.trim(); const item = document.getElementById('form-item').value.trim(); const tagihan = parseInt(document.getElementById('form-tagihan').value) || 0; const jatuhTempo = document.getElementById('form-jatuh-tempo').value.trim(); const totalBulan = parseInt(document.getElementById('form-total-bulan').value) || 1; let lunas = parseInt(document.getElementById('form-lunas').value) || 0; const history = document.getElementById('form-history').value.trim(); if(lunas > totalBulan) lunas = totalBulan;
            let existingPhoto = ""; let existingCustomName = "";
            const existingCustomer = window.allServerData.find(function(d) { return window.normalizeWA(d.wa) === window.normalizeWA(wa); }); 
            if(existingCustomer) { existingPhoto = existingCustomer.photo; existingCustomName = existingCustomer.customName; }
            if (idVal) {
                const itemIndex = window.allServerData.findIndex(function(d) { return String(d.id) === String(idVal); });
                if(itemIndex !== -1) window.allServerData[itemIndex] = { id: window.allServerData[itemIndex].id, name, customName: existingCustomName || name, item, tagihan, totalBulan, lunas, jatuhTempo, history, wa, photo: existingPhoto };
            } else { window.allServerData.push({ id: Date.now(), name, customName: existingCustomName || name, wa, item, tagihan, totalBulan, lunas, jatuhTempo, history, photo: existingPhoto }); }
            
            // Samakan data root nama admin dan wa
            window.allServerData.forEach(function(d) { if(window.normalizeWA(d.wa) === window.normalizeWA(wa)) { d.name = name; d.wa = wa; } });
            
            const query = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase().trim() : '';
            if(query !== '') { window.searchNasabah(); } else { window.appData = window.allServerData; }
            
            window.saveAppDataFirebase(); window.closeModal(); window.renderDashboard();
        };

        window.openPwdModal = function() { document.getElementById('pwd-old').value = ''; document.getElementById('pwd-new').value = ''; document.getElementById('pwd-error').style.display = 'none'; document.getElementById('pwd-success').style.display = 'none'; document.getElementById('pwd-modal').classList.remove('opacity-0', 'pointer-events-none'); document.getElementById('pwd-modal-content').classList.remove('scale-95'); document.getElementById('pwd-modal-content').classList.add('scale-100'); };
        window.closePwdModal = function() { document.getElementById('pwd-modal').classList.add('opacity-0', 'pointer-events-none'); document.getElementById('pwd-modal-content').classList.remove('scale-100'); document.getElementById('pwd-modal-content').classList.add('scale-95'); };
        window.submitPwdAction = function() { if (document.getElementById('pwd-old').value !== window.adminPassword) { document.getElementById('pwd-error').textContent = "Password lama salah!"; document.getElementById('pwd-error').style.display = 'block'; return; } window.adminPassword = document.getElementById('pwd-new').value; localStorage.setItem('ozfinance_admin_pwd', window.adminPassword); document.getElementById('pwd-success').style.display = 'block'; setTimeout(window.closePwdModal, 1500); };
    </script>
</body>
</html>
